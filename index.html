<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Cart - مدرسة روّاد الغد النموذجية أريحا</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- مكتبة الماسح الضوئي الاحترافية -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        body { font-family: 'Cairo', sans-serif; background: linear-gradient(135deg, #eff6ff 0%, #ffffff 100%); }
        .glass-card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.8); }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        .gradient-bg { background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 60%, #3b82f6 100%); }
        .gradient-btn { background: linear-gradient(90deg, #2563eb 0%, #1d4ed8 100%); transition: all 0.3s ease; }
        .gradient-btn:hover { background: linear-gradient(90deg, #1d4ed8 0%, #1e40af 100%); box-shadow: 0 10px 20px -5px rgba(37, 99, 235, 0.4); }
        .loader { border-top-color: #3b82f6; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #reader video { border-radius: 0.75rem; width: 100% !important; object-fit: cover; }
        #reader__dashboard_section_csr { display: none; } /* إخفاء أزرار المكتبة الافتراضية */
        .product-card { transition: transform 0.2s, box-shadow 0.2s; }
        .product-card:hover { transform: translateY(-5px); box-shadow: 0 15px 30px -10px rgba(0,0,0,0.15); }
        .live-dot { animation: blink 1.5s infinite; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
    </style>
</head>
<body class="text-gray-800 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const resizeImage = (file, maxSize, callback) => {
            const reader = new FileReader();
            reader.onload = e => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let width = img.width, height = img.height;
                    if (width > height) { if (width > maxSize) { height *= maxSize / width; width = maxSize; } } 
                    else { if (height > maxSize) { width *= maxSize / height; height = maxSize; } }
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    callback(canvas.toDataURL('image/jpeg', 0.8));
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        };

        const ProductImage = ({ src, alt, className }) => {
            const [error, setError] = useState(false);
            if (!src || error) {
                return (
                    <div className={`flex items-center justify-center bg-blue-50 text-blue-300 ${className}`}>
                        <svg className="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                    </div>
                );
            }
            return <img src={src} alt={alt} className={className} onError={() => setError(true)} />;
        };

        const initialProducts = {
            "6281001010011": { name: "مياه معدنية 500ml", price: 2.5, category: "مشروبات", image: "https://images.unsplash.com/photo-1560887961-9ba4b6d5d242?w=200&q=80" },
            "6281001010028": { name: "عصير برتقال", price: 6.0, category: "مشروبات", image: "https://images.unsplash.com/photo-1600271886742-f049cd451bba?w=200&q=80" },
            "6281001010035": { name: "كوكا كولا", price: 5.0, category: "مشروبات", image: "https://images.unsplash.com/photo-1554866585-cd94860890b7?w=200&q=80" },
            "6281001020035": { name: "تونة بالماء", price: 7.0, category: "معلبات", image: "https://images.unsplash.com/photo-1599487488170-d11ec9c172f0?w=200&q=80" },
            "6281001020011": { name: "فول مدمس", price: 3.0, category: "معلبات", image: "https://images.unsplash.com/photo-1541529086526-db283c563270?w=200&q=80" },
            "6281001030028": { name: "كاجو محمص", price: 30.0, category: "مكسرات", image: "https://images.unsplash.com/photo-1535920726617-6f9c9b3c3c3c?w=200&q=80" },
            "6281001030011": { name: "لوز نيء", price: 25.0, category: "مكسرات", image: "https://images.unsplash.com/photo-1508743625643-3d3d3d3d3d3d?w=200&q=80" },
            "6281001040011": { name: "شوكولاتة داكنة", price: 8.0, category: "حلويات", image: "https://images.unsplash.com/photo-1546171753-97d7676e4602?w=200&q=80" },
            "6281001050011": { name: "حليب كامل الدسم", price: 6.5, category: "ألبان", image: "https://images.unsplash.com/photo-1563636619-e9143da7973b?w=200&q=80" },
            "6281001060011": { name: "صابون غسيل", price: 8.0, category: "منظفات", image: "https://images.unsplash.com/photo-1584559582841-66b4d0c3d3d3?w=200&q=80" }
        };

        const initialDB = {
            malls: { 
                "JERICHO001": { 
                    name: "سوبر ماركت روّاد الغد", password: "1234", currency: "شيكل", id: "JERICHO001", 
                    categories: ["مشروبات", "معلبات", "مكسرات", "حلويات", "ألبان", "منظفات"],
                    products: initialProducts
                } 
            },
            transactions: [],
            cart: { items: [], buyer: null, paid: false, exitCode: null, auditRequired: false }
        };

        const App = () => {
            const [view, setView] = useState('home');
            const [session, setSession] = useState(null);
            const [isSynced, setIsSynced] = useState(false);
            const [isOnline, setIsOnline] = useState(false);
            const [cloudDB, setCloudDB] = useState(initialDB);
            
            const clientRef = useRef(null);
            const dbRef = useRef(cloudDB);
            const isSyncedRef = useRef(false);
            const DB_TOPIC = "smart_cart_jericho_v5_sync";

            useEffect(() => { dbRef.current = cloudDB; }, [cloudDB]);

            useEffect(() => {
                const client = mqtt.connect('wss://broker.hivemq.com:8884/mqtt');
                clientRef.current = client;

                client.on('connect', () => {
                    setIsOnline(true);
                    client.subscribe(DB_TOPIC, { qos: 1 }, (err) => {
                        if (!err) {
                            client.publish(DB_TOPIC, JSON.stringify({ type: 'sync_request' }), { qos: 1 });
                            setTimeout(() => {
                                if (!isSyncedRef.current) {
                                    isSyncedRef.current = true;
                                    client.publish(DB_TOPIC, JSON.stringify({ type: 'db_update', data: dbRef.current }), { retain: true, qos: 1 });
                                    setIsSynced(true);
                                }
                            }, 2000);
                        }
                    });
                });

                client.on('offline', () => setIsOnline(false));
                client.on('error', () => setIsOnline(false));

                client.on('message', (topic, message) => {
                    if (topic === DB_TOPIC) {
                        const msg = JSON.parse(message.toString());
                        if (msg.type === 'sync_request') {
                            if (isSyncedRef.current) client.publish(DB_TOPIC, JSON.stringify({ type: 'db_update', data: dbRef.current }), { retain: true, qos: 1 });
                        } else if (msg.type === 'db_update' && msg.data) {
                            dbRef.current = msg.data;
                            setCloudDB(msg.data);
                            if (!isSyncedRef.current) {
                                isSyncedRef.current = true;
                                setIsSynced(true);
                            }
                        }
                    }
                });

                return () => { if (client) client.end(); };
            }, []);

            const updateCloudDB = (newDB) => {
                dbRef.current = newDB;
                setCloudDB(newDB);
                if (clientRef.current && clientRef.current.connected) {
                    clientRef.current.publish(DB_TOPIC, JSON.stringify({ type: 'db_update', data: newDB }), { retain: true, qos: 1 });
                }
            };

            const updateCart = (newCart) => updateCloudDB({ ...dbRef.current, cart: newCart });
            const updateMallData = (mallId, newMallData) => {
                const newMalls = { ...dbRef.current.malls, [mallId]: newMallData };
                updateCloudDB({ ...dbRef.current, malls: newMalls });
            };

            const startSession = (newSession) => {
                setSession(newSession);
                setView('app');
                if (newSession.type === 'buyer') {
                    updateCart({ ...dbRef.current.cart, buyer: { name: newSession.buyerName, phone: newSession.buyerPhone } });
                }
            };

            const handleLogout = () => { setSession(null); setView('home'); };

            if (!isSynced) {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center gradient-bg text-white">
                        <div className="w-16 h-16 border-4 border-white/30 border-t-white rounded-full loader mb-4"></div>
                        <h2 className="text-2xl font-bold">Smart Cart</h2>
                        <p className="text-blue-100 mt-2">مدرسة روّاد الغد النموذجية - أريحا</p>
                        <p className="text-blue-200 text-sm mt-4">جاري الاتصال بالخادم السحابي...</p>
                    </div>
                );
            }

            if (view === 'home') return <HomeScreen setView={setView} isOnline={isOnline} />;
            if (view === 'buyerEntry') return <BuyerEntryScreen setView={setView} startSession={startSession} malls={cloudDB.malls} />;
            if (view === 'staffLogin') return <StaffLoginScreen setView={setView} startSession={startSession} malls={cloudDB.malls} />;
            if (view === 'register') return <RegisterScreen onBack={() => setView('staffLogin')} malls={cloudDB.malls} updateCloudDB={updateCloudDB} cloudDB={cloudDB} />;

            if (view === 'app' && session) {
                const mallInfo = cloudDB.malls[session.mallId] || { name: 'متجر غير معروف', currency: 'شيكل', products: {}, categories: [] };

                return (
                    <div className="min-h-screen flex flex-col">
                        <header className="gradient-bg text-white p-4 flex justify-between items-center sticky top-0 z-30 shadow-lg">
                            <div className="flex items-center gap-3">
                                <div className="bg-white/20 p-2 rounded-xl backdrop-blur-sm">
                                    <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                                </div>
                                <div>
                                    <h1 className="font-extrabold text-lg leading-tight">Smart Cart - {mallInfo.name}</h1>
                                    <p className="text-xs text-blue-100 flex items-center gap-1">
                                        {session.type === 'buyer' ? `مرحباً ${session.buyerName}` : session.role === 'cashier' ? 'بوابة الأمن والخروج' : 'لوحة تحكم المالك'}
                                        {isOnline && <span className="w-2 h-2 bg-green-300 rounded-full live-dot mr-1"></span>}
                                    </p>
                                </div>
                            </div>
                            <button onClick={handleLogout} className="bg-white/20 hover:bg-white/30 px-4 py-2 rounded-lg text-sm font-bold transition backdrop-blur-sm">خروج</button>
                        </header>

                        <main className="flex-1 p-4 md:p-8 max-w-7xl mx-auto w-full">
                            {session.type === 'buyer' && <CartView mallInfo={mallInfo} cartData={cloudDB.cart} updateCart={updateCart} />}
                            {session.type === 'staff' && session.role === 'cashier' && <SecurityView mallInfo={mallInfo} cloudDB={cloudDB} updateCart={updateCart} updateCloudDB={updateCloudDB} />}
                            {session.type === 'staff' && session.role === 'owner' && <OwnerDashboard mallInfo={mallInfo} cloudDB={cloudDB} updateMallData={updateMallData} liveCart={cloudDB.cart} />}
                        </main>
                        
                        <footer className="text-center py-4 text-xs text-gray-400 border-t border-gray-100 mt-8">
                            مشروع تخرج - مدرسة روّاد الغد النموذجية - أريحا © 2024
                        </footer>
                    </div>
                );
            }
            return null;
        };

        const HomeScreen = ({ setView, isOnline }) => (
            <div className="min-h-screen flex flex-col items-center justify-center gradient-bg p-4 text-center">
                <div className="bg-white/10 backdrop-blur-md p-10 rounded-3xl border border-white/20 max-w-lg w-full">
                    <div className="mb-6">
                        <h1 className="text-5xl font-extrabold text-white tracking-tight">Smart Cart</h1>
                        <p className="text-blue-200 mt-2 text-lg">امسح، ادفع، اخرج - تقنية المستقبل اليوم</p>
                    </div>
                    <div className="bg-white text-blue-800 py-2 px-4 rounded-full inline-block mb-8 text-sm font-bold">
                        مدرسة روّاد الغد النموذجية - أريحا
                    </div>
                    <div className="space-y-4">
                        <button onClick={() => setView('buyerEntry')} className="w-full bg-white text-blue-800 py-4 rounded-xl font-extrabold text-lg hover:bg-blue-50 transition shadow-lg flex items-center justify-center gap-2">
                            <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                            أنا مشتري (ابدأ التسوق الذاتي)
                        </button>
                        <button onClick={() => setView('staffLogin')} className="w-full bg-blue-900/40 text-white border-2 border-white/30 py-4 rounded-xl font-bold text-lg hover:bg-blue-900/60 transition">
                            إدارة المتجر (مالك / أمن)
                        </button>
                    </div>
                </div>
            </div>
        );

        const BuyerEntryScreen = ({ setView, startSession, malls }) => {
            const [mallId, setMallId] = useState('JERICHO001');
            const [name, setName] = useState('');
            const [phone, setPhone] = useState('');
            const [error, setError] = useState('');

            const submit = (e) => {
                e.preventDefault();
                if (!malls[mallId.toUpperCase()]) { setError("رقم المتجر غير صحيح."); return; }
                const phoneRegex = /^(056|059)\d{7}$/;
                if (!phoneRegex.test(phone)) { setError("رقم الهاتف يجب أن يبدأ بـ 056 أو 059."); return; }
                startSession({ type: 'buyer', mallId: mallId.toUpperCase(), buyerName: name, buyerPhone: phone });
            };

            return (
                <div className="min-h-screen flex items-center justify-center gradient-bg p-4">
                    <div className="glass-card rounded-3xl shadow-2xl p-8 w-full max-w-md">
                        <button onClick={() => setView('home')} className="text-blue-600 mb-4 text-sm font-bold">&larr; رجوع</button>
                        <h2 className="text-2xl font-extrabold text-blue-900 mb-2">تسجيل دخول المشتري</h2>
                        <p className="text-blue-500 mb-6 text-sm">أدخل بياناتك لربط سلتك بحسابك (نظام الحماية الرقمي)</p>
                        <form onSubmit={submit} className="space-y-4">
                            <div>
                                <label className="block text-sm font-bold text-blue-800 mb-1">رقم تعريف المتجر</label>
                                <input type="text" value={mallId} onChange={e => setMallId(e.target.value)} className="w-full px-4 py-3 bg-blue-50 border border-blue-100 rounded-xl outline-none focus:ring-2 focus:ring-blue-500" required />
                            </div>
                            <div>
                                <label className="block text-sm font-bold text-blue-800 mb-1">الاسم الكامل</label>
                                <input type="text" value={name} onChange={e => setName(e.target.value)} className="w-full px-4 py-3 bg-blue-50 border border-blue-100 rounded-xl outline-none focus:ring-2 focus:ring-blue-500" placeholder="اسمك" required />
                            </div>
                            <div>
                                <label className="block text-sm font-bold text-blue-800 mb-1">رقم الهاتف</label>
                                <input type="tel" value={phone} onChange={e => setPhone(e.target.value)} className="w-full px-4 py-3 bg-blue-50 border border-blue-100 rounded-xl outline-none focus:ring-2 focus:ring-blue-500" placeholder="056xxxxxxx أو 059xxxxxxx" required />
                            </div>
                            {error && <div className="bg-red-50 text-red-600 p-3 rounded-lg text-sm">{error}</div>}
                            <button type="submit" className="w-full gradient-btn text-white py-4 rounded-xl font-bold text-lg shadow-lg">ابدأ التسوق</button>
                        </form>
                    </div>
                </div>
            );
        };

        const StaffLoginScreen = ({ setView, startSession, malls }) => {
            const [mallId, setMallId] = useState('JERICHO001');
            const [password, setPassword] = useState('');
            const [role, setRole] = useState('owner');
            const [error, setError] = useState('');

            const submit = (e) => {
                e.preventDefault();
                if (malls[mallId.toUpperCase()] && malls[mallId.toUpperCase()].password === password) {
                    startSession({ type: 'staff', mallId: mallId.toUpperCase(), role });
                } else { setError("بيانات الدخول غير صحيحة."); }
            };

            return (
                <div className="min-h-screen flex items-center justify-center gradient-bg p-4">
                    <div className="glass-card rounded-3xl shadow-2xl p-8 w-full max-w-md">
                        <button onClick={() => setView('home')} className="text-blue-600 mb-4 text-sm font-bold">&larr; رجوع</button>
                        <h2 className="text-2xl font-extrabold text-blue-900 mb-6">دخول إدارة المتجر</h2>
                        <form onSubmit={submit} className="space-y-4">
                            <input type="text" value={mallId} onChange={e => setMallId(e.target.value)} placeholder="رقم المتجر" className="w-full px-4 py-3 bg-blue-50 rounded-xl outline-none" required />
                            <input type="password" value={password} onChange={e => setPassword(e.target.value)} placeholder="كلمة السر" className="w-full px-4 py-3 bg-blue-50 rounded-xl outline-none" required />
                            <div className="grid grid-cols-2 gap-2">
                                <button type="button" onClick={() => setRole('cashier')} className={`p-3 rounded-xl font-bold text-sm ${role === 'cashier' ? 'gradient-btn text-white' : 'bg-blue-50 text-blue-600'}`}>بوابة الأمن</button>
                                <button type="button" onClick={() => setRole('owner')} className={`p-3 rounded-xl font-bold text-sm ${role === 'owner' ? 'gradient-btn text-white' : 'bg-blue-50 text-blue-600'}`}>مالك المتجر</button>
                            </div>
                            {error && <div className="bg-red-50 text-red-600 p-3 rounded-lg text-sm">{error}</div>}
                            <button type="submit" className="w-full gradient-btn text-white py-3 rounded-xl font-bold">دخول</button>
                            <button type="button" onClick={() => setView('register')} className="w-full text-blue-600 text-sm py-2">متجر جديد؟ اشترك</button>
                        </form>
                    </div>
                </div>
            );
        };

        const RegisterScreen = ({ onBack, malls, updateCloudDB, cloudDB }) => {
            const [name, setName] = useState('');
            const [id, setId] = useState('');
            const [pass, setPass] = useState('');
            const [done, setDone] = useState(false);

            const submit = (e) => {
                e.preventDefault();
                if (malls[id.toUpperCase()]) { alert("مسجل مسبقاً!"); return; }
                const newMall = { name, password: pass, currency: "شيكل", id: id.toUpperCase(), categories: ["عام"], products: {} };
                updateCloudDB({ ...cloudDB, malls: { ...malls, [id.toUpperCase()]: newMall } });
                setDone(true); setTimeout(onBack, 2000);
            };

            if (done) return <div className="min-h-screen flex items-center justify-center gradient-bg text-white text-2xl font-bold">تم التسجيل بنجاح!</div>;

            return (
                <div className="min-h-screen flex items-center justify-center gradient-bg p-4">
                    <div className="glass-card rounded-3xl shadow-2xl p-8 w-full max-w-md">
                        <h2 className="text-2xl font-extrabold text-blue-900 mb-6 text-center">تسجيل متجر جديد</h2>
                        <form onSubmit={submit} className="space-y-4">
                            <input type="text" value={name} onChange={e=>setName(e.target.value)} placeholder="اسم المتجر" className="w-full px-4 py-3 bg-white/80 rounded-xl outline-none" required />
                            <input type="text" value={id} onChange={e=>setId(e.target.value)} placeholder="رقم تعريف (Mall ID)" className="w-full px-4 py-3 bg-white/80 rounded-xl outline-none" required />
                            <input type="password" value={pass} onChange={e=>setPass(e.target.value)} placeholder="كلمة السر" className="w-full px-4 py-3 bg-white/80 rounded-xl outline-none" required />
                            <button type="submit" className="w-full gradient-btn text-white py-3 rounded-xl font-bold">إنشاء</button>
                            <button type="button" onClick={onBack} className="w-full text-blue-600 text-sm py-2">رجوع</button>
                        </form>
                    </div>
                </div>
            );
        };

        // --- شاشة المشتري (Storefront) ---
        const CartView = ({ mallInfo, cartData, updateCart }) => {
            const [showScanner, setShowScanner] = useState(false);
            const [scanStatus, setScanStatus] = useState(null);
            const [activeCat, setActiveCat] = useState(mallInfo.categories[0] || "");
            const scannerRef = useRef(null);
            const lastScanRef = useRef({ text: null, time: 0 });

            const totalPrice = cartData.items.reduce((s, i) => s + i.price * i.qty, 0);

            const addProduct = (barcode) => {
                const p = mallInfo.products[barcode];
                if (!p) { 
                    setScanStatus({ type: 'error', message: 'الباركود غير معروف في المتجر' });
                    return; 
                }
                const items = [...cartData.items];
                const ex = items.find(i => i.barcode === barcode);
                if (ex) ex.qty++; else items.push({ ...p, barcode, qty: 1 });
                updateCart({ ...cartData, items });
                setScanStatus({ type: 'success', message: `تم إضافة: ${p.name}` });
                if (navigator.vibrate) navigator.vibrate(100);
            };

            // تشغيل الماسح الاحترافي
            useEffect(() => {
                if (showScanner) {
                    setScanStatus(null);
                    const html5QrCode = new Html5Qrcode("reader");
                    scannerRef.current = html5QrCode;
                    
                    html5QrCode.start(
                        { facingMode: "environment" }, 
                        { fps: 10, qrbox: { width: 250, height: 250 } }, 
                        (decodedText) => {
                            // منع القراءة المتكررة لنفس الباركود خلال ثانيتين
                            const now = Date.now();
                            if (lastScanRef.current.text === decodedText && now - lastScanRef.current.time < 2000) return;
                            lastScanRef.current = { text: decodedText, time: now };
                            
                            addProduct(decodedText);
                        }, 
                        (errorMessage) => { /* تجاهل أخطاء القراءة المستمرة */ }
                    ).catch(err => {
                        setScanStatus({ type: 'error', message: "تعذر تشغيل الكاميرا. تأكد من منح الإذن واستخدام HTTPS." });
                    });
                } else {
                    if (scannerRef.current && scannerRef.current.isScanning) {
                        scannerRef.current.stop().catch(err => console.error(err));
                    }
                }
                
                return () => {
                    if (scannerRef.current && scannerRef.current.isScanning) {
                        scannerRef.current.stop().catch(err => console.error(err));
                    }
                };
            }, [showScanner]);

            const changeQty = (barcode, delta) => {
                const items = cartData.items.map(i => {
                    if (i.barcode === barcode) {
                        const newQty = i.qty + delta;
                        return newQty > 0 ? { ...i, qty: newQty } : null;
                    }
                    return i;
                }).filter(Boolean);
                updateCart({ ...cartData, items });
            };

            const processPayment = () => {
                alert("جاري معالجة الدفع عبر البطاقة الائتمانية...");
                setTimeout(() => {
                    const exitCode = Math.floor(100000 + Math.random() * 900000);
                    const auditRequired = Math.random() < 0.2;
                    updateCart({ ...cartData, paid: true, exitCode, auditRequired });
                    if (auditRequired) alert("تنبيه: تم اختيار سلتك للتدقيق الأمني. توجه لبوابة الأمن.");
                    else alert("تم الدفع بنجاح! يمكنك الخروج مباشرة.");
                }, 1500);
            };

            if (cartData.paid) {
                return (
                    <div className="max-w-md mx-auto glass-card rounded-3xl shadow-xl p-8 text-center border-t-4 border-emerald-500">
                        <div className="w-20 h-20 bg-emerald-100 rounded-full flex items-center justify-center mx-auto mb-6">
                            <svg className="w-12 h-12 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="3" d="M5 13l4 4L19 7"></path></svg>
                        </div>
                        <h2 className="text-2xl font-extrabold text-gray-800 mb-2">تمت عملية الدفع بنجاح</h2>
                        <p className="text-gray-500 mb-6">المبلغ المدفوع: <span className="font-bold text-emerald-600">{totalPrice.toFixed(2)} {mallInfo.currency}</span></p>
                        {cartData.auditRequired ? (
                            <div className="bg-amber-50 border-2 border-amber-200 rounded-2xl p-4 mb-6">
                                <p className="font-bold text-amber-800 mb-1">🛑 تسجيل خروج أمني إلزامي</p>
                                <p className="text-sm text-amber-600">يرجى التوجه إلى بوابة الأمن لتدقيق السلة.</p>
                            </div>
                        ) : (
                            <div className="bg-blue-50 border-2 border-blue-100 rounded-2xl p-4 mb-6">
                                <p className="text-sm text-blue-600 mb-1">خروج مباشر</p>
                            </div>
                        )}
                        <div className="bg-gray-900 text-white rounded-2xl p-6 mb-6">
                            <p className="text-xs text-gray-400 mb-2">رمز الخروج (للحارس)</p>
                            <p className="text-5xl font-bold tracking-widest text-emerald-400">{cartData.exitCode}</p>
                        </div>
                        <button onClick={() => updateCart({ items: [], paid: false, exitCode: null, auditRequired: false, buyer: cartData.buyer })} className="w-full bg-gray-200 text-gray-700 py-3 rounded-xl font-bold hover:bg-gray-300 transition">
                            إنهاء الجلسة
                        </button>
                    </div>
                );
            }

            const filteredProducts = Object.keys(mallInfo.products).filter(b => mallInfo.products[b].category === activeCat);

            return (
                <div className="grid md:grid-cols-12 gap-6 max-w-7xl mx-auto">
                    {/* الأقسام (يمين) */}
                    <div className="md:col-span-3 md:order-3 glass-card rounded-3xl p-4 h-fit md:sticky md:top-24">
                        <h3 className="font-bold text-blue-900 mb-4 border-b pb-2">الأقسام</h3>
                        <div className="flex md:flex-col gap-2 overflow-x-auto scrollbar-hide">
                            {mallInfo.categories.map(cat => (
                                <button key={cat} onClick={() => setActiveCat(cat)} className={`px-4 py-2 rounded-xl font-bold text-sm transition whitespace-nowrap text-right ${activeCat === cat ? 'gradient-btn text-white' : 'bg-blue-50 text-blue-600 hover:bg-blue-100'}`}>{cat}</button>
                            ))}
                        </div>
                    </div>

                    {/* المنتجات (وسط) */}
                    <div className="md:col-span-6 md:order-2 glass-card rounded-3xl p-4">
                        <div className="flex justify-between items-center mb-4">
                            <h2 className="text-xl font-extrabold text-blue-900">منتجات قسم: {activeCat}</h2>
                            <button onClick={() => setShowScanner(true)} className="gradient-btn text-white px-4 py-2 rounded-xl font-bold text-sm flex items-center gap-2">
                                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6h2m12 0h2M4 12h16M4 18h2m12 0h2M6 4v16M18 4v16"></path></svg>
                                مسح QR
                            </button>
                        </div>
                        <div className="grid grid-cols-2 sm:grid-cols-3 gap-4 max-h-[600px] overflow-y-auto scrollbar-hide pl-2">
                            {filteredProducts.map(barcode => {
                                const p = mallInfo.products[barcode];
                                return (
                                    <div key={barcode} className="product-card bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden flex flex-col">
                                        <div className="h-28 bg-gray-100 overflow-hidden">
                                            <ProductImage src={p.image} alt={p.name} className="w-full h-full object-cover" />
                                        </div>
                                        <div className="p-3 flex-1 flex flex-col justify-between">
                                            <div>
                                                <h4 className="font-bold text-gray-800 text-sm leading-tight mb-1">{p.name}</h4>
                                                <p className="text-blue-600 font-extrabold">{p.price.toFixed(2)} {mallInfo.currency}</p>
                                            </div>
                                            <button onClick={() => addProduct(barcode)} className="mt-2 w-full bg-blue-100 text-blue-700 py-1 rounded-lg text-sm font-bold hover:bg-blue-200 transition">إضافة +</button>
                                        </div>
                                    </div>
                                )
                            })}
                        </div>
                    </div>

                    {/* السلة (يسار) */}
                    <div className="md:col-span-3 md:order-1 glass-card rounded-3xl p-4 h-fit md:sticky md:top-24 border-t-4 border-blue-500">

                        <div className="bg-blue-50/50 rounded-2xl p-2 flex-1 max-h-[400px] overflow-y-auto scrollbar-hide mb-4 border border-blue-100">

                        <div className="border-t-2 border-blue-100 pt-4">
                            <div className="flex justify-between items-center mb-4">
                                <div><p className="text-xs text-blue-500">الإجمالي</p><p className="text-2xl font-extrabold text-blue-700">{totalPrice.toFixed(2)} <span className="text-sm">{mallInfo.currency}</span></p></div>
                                <button onClick={processPayment} disabled={cartData.items.length === 0} className={`px-4 py-2 rounded-xl font-bold text-white text-sm transition ${cartData.items.length === 0 ? 'bg-gray-300 cursor-not-allowed' : 'bg-emerald-500 hover:bg-emerald-600 shadow-lg'}`}>الدفع</button>
                            </div>

                    </div>

                    {/* نافذة الماسح الضوئي */}

                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // --- شاشة الأمن (Security) ---
        const SecurityView = ({ mallInfo, cloudDB, updateCart, updateCloudDB }) => {
            const cart = cloudDB.cart;
            const totalPrice = cart.items.reduce((s, i) => s + i.price * i.qty, 0);

                }];
                updateCloudDB({ ...cloudDB, transactions: newTransactions, cart: { items: [], buyer: null, paid: false, exitCode: null, auditRequired: false } });
                alert("تم تأكيد خروج المشتري وتسجيل البيع بنجاح.");

            return (
                <div className="max-w-4xl mx-auto grid md:grid-cols-2 gap-6">

                        {cart.buyer ? (
                            <div className="bg-blue-50 p-3 rounded-xl mb-4 border border-blue-100">
                                <p className="text-sm text-gray-600">المشتري: <span className="font-bold text-blue-900">{cart.buyer.name}</span></p>
                                <p className="text-sm text-gray-600">الهاتف: <span className="font-bold text-blue-900">{cart.buyer.phone}</span></p>
                            </div>
                        ) : <p className="text-gray-400 mb-4">لا توجد سلة نشطة.</p>}

                        {cart.paid ? (
                            <div className={`p-6 rounded-2xl text-center border-4 ${cart.auditRequired ? 'bg-amber-50 border-amber-400' : 'bg-emerald-50 border-emerald-400'}`}>
                                <p className="font-bold text-lg mb-2">حالة الدفع: مدفوع ✅</p>
                                <p className="text-sm text-gray-600 mb-4">المبلغ: {totalPrice.toFixed(2)} {mallInfo.currency}</p>
                                <p className="text-xs text-gray-500 mb-1">رمز الخروج:</p>
                                <p className="text-5xl font-bold tracking-widest text-blue-800 mb-4">{cart.exitCode}</p>
                                {cart.auditRequired && <div className="bg-red-100 text-red-700 p-3 rounded-lg font-bold mb-4">⚠️ للتدقيق الأمني!</div>}
                                <div className="max-h-40 overflow-y-auto mb-4 text-right bg-white p-3 rounded-lg">
                                    {cart.items.map(item => (
                                        <div key={item.barcode} className="flex justify-between text-sm border-b py-1">
                                            <span>{item.name} × {item.qty}</span>
                                            <span>{(item.price * item.qty).toFixed(2)}</span>
                                        </div>
                                    ))}
                                </div>
                                <button onClick={clearCart} className="w-full bg-gray-800 text-white py-3 rounded-xl font-bold">تأكيد الخروج ومسح</button>
                            </div>
                        ) : <div className="text-center text-gray-400 p-12 bg-gray-50 rounded-2xl">بانتظار الدفع...</div>}
                    </div>

                    <div className="glass-card rounded-3xl shadow-xl p-6">
                        <h2 className="text-xl font-extrabold text-blue-900 mb-4">سجل عمليات اليوم</h2>
                        <div className="space-y-3 max-h-[500px] overflow-y-auto scrollbar-hide">
                            {cloudDB.transactions.length === 0 ? <p className="text-center text-gray-400 p-8">لا توجد معاملات.</p> : cloudDB.transactions.slice().reverse().map((tx, idx) => (
                                <div key={idx} className="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
                                    <div className="flex justify-between mb-2">
                                        <span className="font-bold text-gray-800">{tx.buyer?.name}</span>
                                        <span className="font-bold text-emerald-600">{tx.total.toFixed(2)} {mallInfo.currency}</span>
                                    </div>
                                    <div className="flex justify-between text-xs text-gray-500">
                                        <span>{tx.buyer?.phone}</span>
                                        <span>{tx.auditRequired ? '🛑 تم تدقيقها' : '✅ خروج مباشر'}</span>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        // --- لوحة المالك (Owner) ---
        const OwnerDashboard = ({ mallInfo, cloudDB, updateMallData, liveCart }) => {
            const [activeCategory, setActiveCategory] = useState(mallInfo.categories[0] || "");
            const [showProductForm, setShowProductForm] = useState(false);
            const [confirmDel, setConfirmDel] = useState(null);
            
            const [pBarcode, setPBarcode] = useState('');
            const [pName, setPName] = useState('');
            const [pPrice, setPPrice] = useState('');
            const [pCategory, setPCategory] = useState(mallInfo.categories[0] || "");
            const [pImage, setPImage] = useState('');

            const transactions = cloudDB.transactions.filter(tx => tx.mallId === mallInfo.id).reverse();
            const totalRevenue = transactions.reduce((s, t) => s + t.total, 0);
            const liveCartTotal = liveCart.items.reduce((s, i) => s + i.price * i.qty, 0);

            useEffect(() => { if (!mallInfo.categories.includes(activeCategory)) setActiveCategory(mallInfo.categories[0] || ""); }, [mallInfo.categories]);

            const addProduct = (e) => {
                e.preventDefault();
                if (mallInfo.products[pBarcode]) { alert("هذا الباركود مسجل!"); return; }
                const newProduct = { name: pName, price: parseFloat(pPrice), category: pCategory, image: pImage };
                updateMallData(mallInfo.id, { ...mallInfo, products: { ...mallInfo.products, [pBarcode]: newProduct } });
                setPBarcode(''); setPName(''); setPPrice(''); setPImage('');
                setShowProductForm(false);
            };

            const executeDelete = (barcode) => {
                const newProducts = { ...mallInfo.products };
                delete newProducts[barcode];
                updateMallData(mallInfo.id, { ...mallInfo, products: newProducts });
                setConfirmDel(null);
            };

            const filteredProducts = Object.keys(mallInfo.products).filter(b => mallInfo.products[b].category === activeCategory);

            return (
                <div className="max-w-6xl mx-auto space-y-8">
                    {/* المراقبة الحية */}
                    <div className="glass-card rounded-3xl shadow-xl p-6 border-t-4 border-emerald-500">
                        <div className="flex justify-between items-center mb-4">
                            <h2 className="text-xl font-extrabold text-blue-900 flex items-center gap-2">
                                <span className="w-3 h-3 bg-emerald-500 rounded-full live-dot"></span>
                                مراقبة السلة الحية (Live Cart)
                            </h2>
                            <span className="font-bold text-emerald-600">{liveCartTotal.toFixed(2)} {mallInfo.currency}</span>
                        </div>
                        {liveCart.buyer ? (
                            <div className="bg-blue-50 p-3 rounded-xl mb-4 border border-blue-100 flex justify-between items-center">
                                <div>
                                    <p className="text-xs text-blue-400">المشتري الحالي</p>
                                    <p className="font-bold text-blue-900">{liveCart.buyer.name} - {liveCart.buyer.phone}</p>
                                </div>
                                {liveCart.paid && <span className="bg-emerald-500 text-white px-3 py-1 rounded-full text-xs font-bold">مدفوع - بانتظار الخروج</span>}
                            </div>
                        ) : <p className="text-gray-400 text-sm mb-4">لا يوجد مشتري نشط حالياً.</p>}
                        <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 max-h-32 overflow-y-auto scrollbar-hide">
                            {liveCart.items.map(item => (
                                <div key={item.barcode} className="bg-white p-2 rounded-lg text-xs shadow-sm flex items-center gap-2">
                                    <ProductImage src={item.image} alt={item.name} className="w-8 h-8 rounded object-cover" />
                                    <div>
                                        <p className="font-bold text-gray-800">{item.name}</p>
                                        <p className="text-gray-500">× {item.qty}</p>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>

                    {/* الإحصائيات */}
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div className="glass-card p-6 rounded-3xl shadow-lg border-r-4 border-blue-500">
                            <p className="text-blue-500 text-sm font-bold">إجمالي المبيعات</p>
                            <h2 className="text-3xl font-extrabold text-blue-900 mt-2">{totalRevenue.toFixed(2)} <span className="text-lg">{mallInfo.currency}</span></h2>
                        </div>
                        <div className="glass-card p-6 rounded-3xl shadow-lg border-r-4 border-cyan-500">
                            <p className="text-cyan-500 text-sm font-bold">عدد المنتجات</p>
                            <h2 className="text-3xl font-extrabold text-blue-900 mt-2">{Object.keys(mallInfo.products).length}</h2>
                        </div>
                        <div className="glass-card p-6 rounded-3xl shadow-lg border-r-4 border-indigo-500">
                            <p className="text-indigo-500 text-sm font-bold">عدد العملاء</p>
                            <h2 className="text-3xl font-extrabold text-blue-900 mt-2">{transactions.length}</h2>
                        </div>
                    </div>

                    {/* إدارة المنتجات */}
                    <div className="glass-card rounded-3xl shadow-xl p-6">
                        <div className="flex justify-between items-center mb-6">
                            <h2 className="text-2xl font-extrabold text-blue-900">إدارة المنتجات</h2>
                            <button onClick={() => setShowProductForm(!showProductForm)} className="gradient-btn text-white px-6 py-3 rounded-xl font-bold text-sm flex items-center gap-2">

                                إضافة منتج

                        </div>

                        {showProductForm && (
                            <form onSubmit={addProduct} className="bg-white p-6 rounded-2xl mb-6 grid grid-cols-1 md:grid-cols-2 gap-4 border-2 border-blue-200">

                                <div>
                                    <label className="block text-xs font-bold text-gray-600 mb-1">الباركود</label>
                                    <input type="text" value={pBarcode} onChange={e=>setPBarcode(e.target.value)} className="w-full px-4 py-2 bg-blue-50 rounded-lg outline-none" required />

                                    <label className="block text-xs font-bold text-gray-600 mb-1">اسم المنتج</label>

                                <div>
                                    <label className="block text-xs font-bold text-gray-600 mb-1">القسم</label>

                                    <button type="button" onClick={() => setShowProductForm(false)} className="bg-gray-200 text-gray-700 px-6 py-3 rounded-xl font-bold">إلغاء</button>
                                </div>

                            ))}
                        </div>

                                        </div>
                                        <div className="p-4">
                                            <h4 className="font-bold text-blue-900">{p.name}</h4>
                                            <p className="text-emerald-600 font-bold mb-3">{p.price.toFixed(2)} {mallInfo.currency}</p>
                                            {confirmDel === barcode ? (
                                                <div className="flex gap-2">
                                                    <button onClick={() => executeDelete(barcode)} className="flex-1 bg-red-500 text-white py-1 rounded-lg text-xs font-bold">تأكيد</button>
                                                    <button onClick={() => setConfirmDel(null)} className="flex-1 bg-gray-200 py-1 rounded-lg text-xs font-bold">إلغاء</button>
                                                </div>
                                            ) : (
                                                <button onClick={() => setConfirmDel(barcode)} className="w-full text-red-500 border border-red-100 py-1 rounded-lg text-xs font-bold">حذف</button>
                                            )}
                                        </div>
                                    </div>
                                )
                            })}
                        </div>
                    </div>

                    {/* سجل المشتريات التفصيلي (الطلبات) */}
                    <div className="glass-card rounded-3xl shadow-xl p-6">
                        <h2 className="text-2xl font-extrabold text-blue-900 mb-4">سجل المشتريات التفصيلي</h2>
                        <div className="overflow-x-auto">
                            <table className="w-full text-right border-collapse">
                                <thead>
                                    <tr className="border-b-2 border-blue-100 text-blue-800">
                                        <th className="p-3 text-sm">اسم المشتري</th>
                                        <th className="p-3 text-sm">رقم الهاتف</th>
                                        <th className="p-3 text-sm">الأغراض المشتراة</th>
                                        <th className="p-3 text-sm">المبلغ</th>
                                        <th className="p-3 text-sm">وقت الدفع</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {transactions.length === 0 ? (
                                        <tr><td colSpan="5" className="text-center p-8 text-blue-300">لا توجد مبيعات مسجلة بعد.</td></tr>
                                    ) : (
                                        transactions.map((tx, idx) => (
                                            <tr key={idx} className="border-b border-blue-50 hover:bg-blue-50/50">
                                                <td className="p-3 font-bold text-blue-900">{tx.buyer?.name || '-'}</td>
                                                <td className="p-3 text-gray-600">{tx.buyer?.phone || '-'}</td>
                                                <td className="p-3 text-xs text-gray-500 max-w-xs">
                                                    {tx.items.map(i => `${i.name} (${i.qty})`).join('، ')}
                                                </td>
                                                <td className="p-3 font-bold text-emerald-600">{tx.total.toFixed(2)} {mallInfo.currency}</td>
                                                <td className="p-3 text-xs text-gray-400">{new Date(tx.date).toLocaleString('ar-EG')}</td>
                                            </tr>
                                        ))
                                    )}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        };

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
